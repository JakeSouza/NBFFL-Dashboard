# Save this file to: .github/workflows/update-dashboard.yml
# in your repo (create the .github/workflows/ folders if they don't exist).
#
# It runs the dashboard script daily, and if the HTML changed, commits and
# pushes it — which triggers Netlify's normal auto-deploy on push.
#
# SETUP:
# 1. In your GitHub repo, go to Settings -> Secrets and variables -> Actions
# 2. Add these repository secrets:
#      LEAGUE_ID          -> your ESPN league ID
#      YEAR               -> e.g. 2026
#      ESPN_S2            -> your espn_s2 cookie value
#      SWID               -> your SWID cookie value (including the curly braces)
#      HISTORY_START_YEAR -> optional, defaults to 2018. Set this if your
#                             league started later, or to limit how many
#                             past seasons get fetched (fewer = faster runs).
# 3. Commit this file to your repo. It will start running on the schedule
#    below, and you can also trigger it manually from the Actions tab.
#
# Note: fetching many seasons of history (draft, rosters, schedules) makes
# each run take longer than a single-season dashboard would. The 20-minute
# timeout below should comfortably cover a decade of history; raise it if
# you have an unusually large league or roster.

name: Update Fantasy Dashboard

on:
  schedule:
    # Runs daily at 09:00 UTC. Adjust as you like — cron is in UTC, not
    # your local time. https://crontab.guru is handy for editing this.
    - cron: "0 9 * * *"
  workflow_dispatch: {}  # lets you click "Run workflow" manually in the Actions tab

permissions:
  contents: write  # needed so the workflow can push the updated HTML back

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install espn_api

      - name: Generate dashboard
        env:
          LEAGUE_ID: ${{ secrets.LEAGUE_ID }}
          YEAR: ${{ secrets.YEAR }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
          HISTORY_START_YEAR: ${{ secrets.HISTORY_START_YEAR }}
        run: python espn_dashboard.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "Auto-update fantasy dashboard - $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push